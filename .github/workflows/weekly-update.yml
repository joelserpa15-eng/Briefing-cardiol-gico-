name: Monthly Cardiology Briefing Update

on:
  schedule:
    - cron: '0 7 1 * *'   # 1st of every month at 07:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to fetch (YYYY-MM format, default: previous month)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── 1. Fetch articles & update JSON ──────────────────────────────────────
  fetch:
    name: Fetch Articles
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.11'

      - name: Fetch articles from PubMed & Europe PMC
        env:
          NCBI_EMAIL:   ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          MONTH="${{ github.event.inputs.month }}"
          if [ -n "$MONTH" ]; then
            python scripts/fetch_articles.py --month "$MONTH"
          else
            python scripts/fetch_articles.py
          fi

      - name: Commit & push updated articles
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/articles.json; then
            echo "No changes — skipping commit."
          else
            MONTH_LABEL=$(python -c "
          from datetime import datetime, timedelta
          import calendar
          today = datetime.utcnow()
          first_of_current = today.replace(day=1)
          month_dt = (first_of_current - timedelta(days=1)).replace(day=1)
          months_es = ['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']
          print(f'{months_es[month_dt.month].capitalize()} {month_dt.year}')
            ")
            git add data/articles.json data/index.json data/articles-*.json
            git commit -m "data: briefing mensual ${MONTH_LABEL}"
            git push origin HEAD
          fi

  # ── 2. Deploy to GitHub Pages ─────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (with latest data)
        uses: actions/checkout@v4.2.2
        with:
          ref: claude/greeting-v36aru

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Print URL
        run: |
          echo ""
          echo "======================================================"
          echo "  Briefing publicado en:"
          echo "  ${{ steps.deployment.outputs.page_url }}"
          echo "======================================================"
